{{- $src     := .Get "src" -}}
{{- $caption := .Get "caption" -}}

<figure class="my-8">
  <video controls class="w-full rounded-2xl" preload="metadata">
    <source src="{{ $src }}" type="video/mp4">
  </video>
  {{ with $caption }}
  <figcaption class="text-xs text-slate-400 text-center mt-2">{{ . }}</figcaption>
  {{ end }}
</figure>
